[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d2c13_2"
version = "0.13.2"
description = "D2C_13_2 typed audit-contract artifact and interoperability layer"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.8",
  "absl-py>=1.0",
  "exceptiongroup>=1.1",
  "flask>=3.0",
  "google-cloud-storage>=2.14",
  "google-genai>=1.39",
  "langchain-community>=0.2",
  "langchain-core>=0.2",
  "matplotlib>=3.7",
  "ml-collections>=0.1",
  "more-itertools>=9.0",
  "networkx>=3.4",
  "numpy>=1.24",
  "openai>=1.50",
  "pandas>=1.5",
  "pydantic>=2.0",
  "pyshacl>=0.40",
  "python-dotenv>=0.19",
  "PyYAML>=6.0",
  "rdflib>=7.6",
  "regex>=2023.0",
  "requests>=2.31",
  "scipy>=1.10",
  "sentence-transformers>=2.6",
  "smolagents>=1.4",
  "tqdm>=4.66",
  "typing-extensions>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:rdflib.*",
]

[tool.setuptools.packages.find]
include = ["d2c13_2*"]

